name: Drip-publish blog post

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish the next post now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: drip-blog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish next queued post
        id: drip
        run: python scripts/drip_publish.py ${{ inputs.force && '--force' || '' }}
      - name: Commit and push
        if: steps.drip.outputs.published != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A blog sitemap.xml _queue
          git commit -m "Publish blog post: ${{ steps.drip.outputs.published }}"
          git push
